<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvanceCerto. Marketing para clínicas odontológicas</title>
<meta name="description" content="AvanceCerto, marketing para clínicas odontológicas em Brasília. Site novo em breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #0E5A5B;
    --grafite: #1F2428;
    --cinza: #5B6166;
    --fundo: #F7F6F3;
    --card: #ECEAE6;
    --menta: #DCEDEA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--fundo);
    color: var(--grafite);
    font-family: 'Open Sans', system-ui, sans-serif;
    line-height: 1.6;
  }
  main { width: 100%; max-width: 560px; }
  .marca {
    border-left: 4px solid var(--verde);
    padding-left: 20px;
    margin-bottom: 32px;
  }
  h1 {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: clamp(2.2rem, 7vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  h1 .fino { font-weight: 300; }
  h1 .forte { font-weight: 700; color: var(--verde); }
  .nicho { margin-top: 8px; color: var(--cinza); font-size: 1.05rem; }
  .aviso {
    background: var(--menta);
    padding: 20px 24px;
    margin-bottom: 28px;
  }
  .aviso strong { display: block; font-family: 'Inter', system-ui, sans-serif; font-size: 1.15rem; margin-bottom: 4px; }
  .contatos { display: grid; gap: 12px; }
  .contatos a {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    background: var(--card);
    color: var(--grafite);
    text-decoration: none;
    transition: background .2s, color .2s;
  }
  .contatos a span:last-child { color: var(--cinza); text-align: right; word-break: break-all; }
  .contatos a:hover, .contatos a:focus-visible { background: var(--verde); color: #fff; }
  .contatos a:hover span:last-child, .contatos a:focus-visible span:last-child { color: var(--menta); }
  .contatos a.principal { background: var(--verde); color: #fff; font-weight: 700; }
  .contatos a.principal span:last-child { color: var(--menta); font-weight: 400; }
  footer { margin-top: 36px; font-size: .85rem; color: var(--cinza); }
</style>
</head>
<body>
<main>
  <div class="marca">
    <h1><span class="fino">Avance</span><span class="forte">Certo</span></h1>
    <p class="nicho">Marketing para clínicas odontológicas em Brasília.</p>
  </div>

  <div class="aviso">
    <strong>Site novo em breve.</strong>
    Enquanto ele não fica pronto, o atendimento continua normalmente pelos canais abaixo.
  </div>

  <nav class="contatos" aria-label="Contatos">
    <a class="principal" href="https://wa.me/15819999095" target="_blank" rel="noopener"><span>WhatsApp</span><span>+1 (581) 999-9095</span></a>
    <a href="mailto:contato@avancecerto.com"><span>E-mail</span><span>contato@avancecerto.com</span></a>
    <a href="https://www.instagram.com/avancecerto1/" target="_blank" rel="noopener"><span>Instagram</span><span>@avancecerto1</span></a>
  </nav>

  <footer>© 2026 AvanceCerto. Todos os direitos reservados.</footer>
</main>
</body>
</html>
